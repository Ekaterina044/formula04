<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Формула здоровья</title>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Frank Ruhl Libre', 'Inter', sans-serif;
            background: linear-gradient(135deg, #e8ddd7 0%, #f5f0ed 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container { width: 100%; max-width: 500px; margin: 0 auto; }
        .login-card {
            background: white;
            border-radius: 32px;
            padding: 48px 40px;
            box-shadow: 0 25px 50px rgba(70,33,26,0.15);
            text-align: center;
        }
        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            cursor: pointer;
            text-decoration: none;
        }
        .login-logo-img { height: 70px; width: auto; transition: transform 0.2s; }
        .login-logo-img:hover { transform: scale(1.02); }
        .login-logo-text {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #64b61a 0%, #e8be52 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .tab-buttons {
            display: flex;
            border-bottom: 2px solid #e8ddd7;
            margin-bottom: 32px;
        }
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 12px;
            font-size: 18px;
            font-weight: 600;
            color: #693D3D;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
        }
        .tab-btn.active { color: #64b61a; position: relative; }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: #64b61a;
        }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #46211A; font-size: 14px; }
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #e0d6d0;
            border-radius: 50px;
            font-size: 16px;
            font-family: inherit;
            background: #faf8f7;
            transition: 0.2s;
        }
        .form-group input:focus { outline: none; border-color: #64b61a; box-shadow: 0 0 0 3px rgba(100,182,26,0.1); }
        .forgot-link {
            display: inline-block;
            margin-top: 12px;
            color: #64b61a;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #000000;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            transition: 0.2s;
        }
        .btn-submit:hover { background: #333333; transform: translateY(-1px); }
        .auth-footer {
            margin-top: 32px;
            font-size: 12px;
            color: #693D3D;
            border-top: 1px solid #e8ddd7;
            padding-top: 24px;
        }
        .error-message {
            background: #fee2e2;
            color: #A43820;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }
        .form-panel { display: none; }
        .form-panel.active { display: block; }
        
        /* Стили для модального окна восстановления пароля */
        .reset-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }
        .reset-modal.active {
            display: flex;
        }
        .reset-modal-content {
            background: white;
            border-radius: 32px;
            padding: 40px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        .reset-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 30px;
            height: 30px;
            background: transparent;
            border: none;
            cursor: pointer;
        }
        .reset-modal-close::before,
        .reset-modal-close::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 2px;
            background: #693D3D;
            top: 14px;
            left: 5px;
        }
        .reset-modal-close::before { transform: rotate(45deg); }
        .reset-modal-close::after { transform: rotate(-45deg); }
        .reset-modal-close:hover::before,
        .reset-modal-close:hover::after {
            background: #64b61a;
        }
        .reset-modal-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }
        .reset-modal-logo img { height: 50px; }
        .reset-modal-logo span {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(135deg, #64b61a 0%, #e8be52 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .reset-modal h3 {
            font-size: 24px;
            font-weight: 700;
            color: #46211A;
            margin-bottom: 20px;
        }
        .reset-modal .form-group {
            margin-bottom: 25px;
        }
        .reset-modal .btn-reset {
            width: 100%;
            padding: 14px;
            background: #000000;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .reset-modal .btn-reset:hover {
            background: #333333;
            transform: translateY(-1px);
        }
        .reset-note {
            font-size: 12px;
            color: #693D3D;
            margin-top: 20px;
        }
        
        @media (max-width: 480px) {
            .login-card { padding: 32px 24px; }
            .login-logo-img { height: 50px; }
            .login-logo-text { font-size: 18px; }
            .reset-modal-content { padding: 30px 25px; }
            .reset-modal h3 { font-size: 20px; }
        }

        .forgot-link {
    margin-top: 12px;
    font-size: 14px;
}

.forgot-link span {
    color: #693D3D;
}

.forgot-link a {
    color: #64b61a;
    text-decoration: underline;
    text-underline-offset: 3px;
    margin-left: 5px;
    cursor: pointer;
}

.forgot-link a:hover {
    color: #4d8e14;
}
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <a href="index.html" class="login-logo">
                <img src="logo.png" alt="Формула здоровья" class="login-logo-img">
                <span class="login-logo-text">Формула здоровья</span>
            </a>
            
            <div class="tab-buttons" id="tabButtons">
                <button class="tab-btn active" data-tab="login">Вход</button>
                <button class="tab-btn" data-tab="register">Регистрация</button>
            </div>
            
            <div id="errorMessage" class="error-message"></div>
            
            <!-- Панель входа -->
            <div id="loginPanel" class="form-panel active">
                <form id="loginForm">
                    <div class="form-group">
                        <label>E-mail *</label>
                        <input type="email" id="loginEmail" placeholder="example@mail.com" required>
                    </div>
                    <div class="form-group">
                        <label>Пароль *</label>
                        <input type="password" id="loginPassword" placeholder="••••••" required>
                    </div>
                    <button type="submit" class="btn-submit">Войти</button>
                    <div class="forgot-link">
                        <span>Забыли пароль?</span>
                        <a href="#" id="forgotLinkBtn" style="color: #64b61a; text-decoration: underline; text-underline-offset: 3px; margin-left: 5px; cursor: pointer;">Восстановить</a>
                    </div>
                </form>
            </div>
            
            <!-- Панель регистрации -->
            <div id="registerPanel" class="form-panel">
                <form id="registerForm">
                    <div class="form-group"><label>Имя и фамилия *</label><input type="text" id="regName" placeholder="Иван Иванов" required></div>
                    <div class="form-group"><label>E-mail *</label><input type="email" id="regEmail" placeholder="example@mail.com" required></div>
                    <div class="form-group"><label>Пароль (мин. 6 символов) *</label><input type="password" id="regPassword" placeholder="••••••" required></div>
                    <div class="form-group"><label>Телефон</label><input type="tel" id="regPhone" placeholder="+7 (___) ___-__-__"></div>
                    <button type="submit" class="btn-submit">Зарегистрироваться</button>
                    <div class="forgot-link">
    <span>Забыли пароль?</span>
    <a href="#" id="forgotLink">Восстановить</a>
</div>
                </form>
            </div>
            
            <!-- Панель восстановления пароля (вместо модального окна) -->
            <div id="resetPanel" class="form-panel">
                <div style="text-align: center; margin-bottom: 20px;">
                    <h3 style="font-size: 24px; font-weight: 700; color: #46211A; margin-bottom: 10px;">Восстановление пароля</h3>
                </div>
                <div class="form-group">
                    <input type="email" id="resetEmailInput" placeholder="Укажите ваш E-mail">
                </div>
                <button class="btn-submit" id="resetPasswordBtnNew">Отправить</button>
                <div style="text-align: center; margin-top: 20px;">
                    <a href="#" id="backToLoginBtn" style="color: #64b61a; text-decoration: none; font-size: 14px;">← Вернуться ко входу</a>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let usersDatabase = JSON.parse(localStorage.getItem('users')) || [
            { name: "Иван Петров", email: "ivan@test.ru", password: "123456", phone: "" },
            { name: "Мария Сидорова", email: "maria@test.ru", password: "123456", phone: "" }
        ];
        
        function saveUsers() { localStorage.setItem('users', JSON.stringify(usersDatabase)); }
        
        const tabBtns = document.querySelectorAll('.tab-btn');
        const loginPanel = document.getElementById('loginPanel');
        const registerPanel = document.getElementById('registerPanel');
        const resetPanel = document.getElementById('resetPanel');
        const errorDiv = document.getElementById('errorMessage');
        const tabButtons = document.getElementById('tabButtons');
        
        function showError(msg) { errorDiv.textContent = msg; errorDiv.style.display = 'block'; setTimeout(() => errorDiv.style.display = 'none', 3000); }
        
        // Переключение вкладок (только между входом и регистрацией)
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (btn.dataset.tab === 'login') {
                    loginPanel.classList.add('active');
                    registerPanel.classList.remove('active');
                    resetPanel.classList.remove('active');
                } else {
                    loginPanel.classList.remove('active');
                    registerPanel.classList.add('active');
                    resetPanel.classList.remove('active');
                }
            });
        });
        
        // Открытие панели восстановления (заменяет вход/регистрацию)
        function showResetPanel() {
            loginPanel.classList.remove('active');
            registerPanel.classList.remove('active');
            resetPanel.classList.add('active');
            tabButtons.style.display = 'none';
        }
        
        // Возврат к панели входа
        function backToLogin() {
            resetPanel.classList.remove('active');
            loginPanel.classList.add('active');
            tabButtons.style.display = 'flex';
            // Сбрасываем активную вкладку
            tabBtns.forEach(b => {
                b.classList.remove('active');
                if (b.dataset.tab === 'login') b.classList.add('active');
            });
        }
        
        // Кнопки "Восстановить"
        const forgotBtn = document.getElementById('forgotLinkBtn');
        const forgotBtnReg = document.getElementById('forgotLinkBtnReg');
        if (forgotBtn) forgotBtn.addEventListener('click', (e) => { e.preventDefault(); showResetPanel(); });
        if (forgotBtnReg) forgotBtnReg.addEventListener('click', (e) => { e.preventDefault(); showResetPanel(); });
        
        // Кнопка "Вернуться ко входу"
        const backBtn = document.getElementById('backToLoginBtn');
        if (backBtn) backBtn.addEventListener('click', (e) => { e.preventDefault(); backToLogin(); });
        
        // Отправка восстановления пароля
        const resetPasswordBtn = document.getElementById('resetPasswordBtnNew');
        const resetEmailInput = document.getElementById('resetEmailInput');
        
        if (resetPasswordBtn) {
            resetPasswordBtn.addEventListener('click', () => {
                const resetEmail = resetEmailInput.value.trim();
                if (!resetEmail) {
                    alert('Пожалуйста, укажите ваш email');
                    return;
                }
                
                const user = usersDatabase.find(u => u.email === resetEmail);
                if (user) {
                    const newPassword = Math.random().toString(36).slice(-8);
                    user.password = newPassword;
                    saveUsers();
                    alert(`✅ Новый пароль для ${resetEmail}: ${newPassword}\n\nРекомендуем сменить пароль в личном кабинете после входа.`);
                    backToLogin();
                    resetEmailInput.value = '';
                } else {
                    alert('❌ Пользователь с таким email не найден.\n\nДемо-логины:\nivan@test.ru / 123456\nmaria@test.ru / 123456');
                }
            });
        }
        
        // Вход
        document.getElementById('loginForm').onsubmit = (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const user = usersDatabase.find(u => u.email === email && u.password === password);
            if (user) {
                sessionStorage.setItem('currentUser', JSON.stringify(user));
                const returnUrl = sessionStorage.getItem('returnUrl') || 'index.html';
                sessionStorage.removeItem('returnUrl');
                window.location.href = returnUrl;
            } else { showError('Неверный email или пароль'); }
        };
        
        // Регистрация
        document.getElementById('registerForm').onsubmit = (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const phone = document.getElementById('regPhone').value;
            if (password.length < 6) { showError('Пароль должен быть не менее 6 символов'); return; }
            if (usersDatabase.find(u => u.email === email)) { showError('Пользователь с таким email уже существует'); return; }
            const newUser = { name, email, password, phone };
            usersDatabase.push(newUser);
            saveUsers();
            sessionStorage.setItem('currentUser', JSON.stringify(newUser));
            const returnUrl = sessionStorage.getItem('returnUrl') || 'index.html';
            sessionStorage.removeItem('returnUrl');
            window.location.href = returnUrl;
        };
    </script>
</body>
</html>
